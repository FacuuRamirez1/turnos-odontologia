# CI C-01 — jobs paralelos backend + frontend; un fallo bloquea el merge (branch protection).
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check app
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest -q
      - name: Guard P15 (prohibido PAGO_MODO=simulado en production)
        env:
          ENVIRONMENT: production
          JWT_SECRET: ci-secret-real-ficticio
          MP_WEBHOOK_SECRET: ci-webhook-real-ficticio
          PAGO_MODO: simulado
        run: |
          python - <<'EOF'
          from app.main import verificar_guard_produccion
          try:
              verificar_guard_produccion()
          except ValueError as exc:
              assert "P15" in str(exc)
          else:
              raise SystemExit("Guard P15 no bloqueó PAGO_MODO=simulado en production")
          EOF

  frontend:
    name: frontend (tsc + eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build --if-present
