name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      # P15: CI nunca usa ENVIRONMENT=production con PAGO_MODO=simulado.
      # Para tests/CI se usa ENVIRONMENT=test con PAGO_MODO=simulado (permitido por P15).
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/turnos_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-ficticio-no-usar-en-produccion
      MP_WEBHOOK_SECRET: test-webhook-secret-ficticio
      PAGO_MODO: simulado
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: test@clinica-ficticia.example.ar
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turnos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff lint
        run: |
          pip install ruff
          ruff check app/

      - name: Run Mypy type check
        run: |
          pip install mypy
          mypy app/

      - name: Run P15 guard de arranque
        run: |
          python -c "from app.main import verificar_guard_produccion; verificar_guard_produccion(); print('P15 guard OK')"

      - name: Run pytest
        run: |
          pip install pytest pytest-asyncio
          python -m pytest app/tests/ -v
