[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (llamadas en defaults) es el idioma estándar de FastAPI Depends(...):
# el guard RBAC y los endpoints lo usan por diseño (C-03).
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
